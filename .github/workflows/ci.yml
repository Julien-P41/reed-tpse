# Build the project and run the hardware-free checks.
#
# The suite covers the frame protocol, config round-trips, payload shapes
# against captured vendor traffic, and the status cache. None of it touches a
# device, so it runs anywhere.
#
# No assertion count here on purpose: the last one said 91 across three
# binaries and was wrong within a day of a fourth being added. ctest prints
# what actually ran. It was off by default and
# nothing ran it, which for a project whose commit log is largely "here is a
# wire bug that looked like success" was the cheapest insurance left unbought.
name: build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # v4 targets Node 20, which the runners now force onto Node 24 and warn
      # about on every run. v7 is current.
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DREED_BUILD_TESTS=ON

      # Piped through tee so the warning step can read this build's output
      # instead of doing a second one. pipefail keeps a build failure fatal --
      # without it tee's exit status hides the compiler's.
      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j 2>&1 | tee build.log

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The sleep hook is a shipped script and CMake only substitutes into it,
      # so a syntax error would reach users unbuilt and unrun. The @...@
      # placeholders are ordinary text to the shell, so the template parses as
      # it stands.
      - name: Check the sleep hook parses
        run: sh -n systemd/reed-tpse-sleep.in

      # Not warning-free-as-a-gate: a newer GCC than this runner's can invent
      # new warnings and turn the build red for something nobody changed. This
      # reports them so a regression is visible in the log without blocking.
      #
      # Reads the build above rather than repeating it. It used to configure and
      # compile the whole project a second time, which roughly doubled the run
      # for a number already available in the first build's output.
      - name: Report compiler warnings
        run: |
          echo "warning lines: $(grep -c 'warning:' build.log || true)"
          grep 'warning:' build.log || echo "(none)"
